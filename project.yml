name: DiskSweep

options:
  bundleIdPrefix: com.disksweep
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    # No build scripts are used. Disabling this avoids nested sandbox failures for
    # Swift/SwiftUI compiler macro plug-ins in restricted build environments.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  DiskSweep:
    type: application
    platform: macOS
    sources:
      - path: DiskSweep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.disksweep.DiskSweep
        PRODUCT_NAME: DiskSweep
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DiskSweep
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: DiskSweep analyzes Downloads only when you request it and never uploads file information.
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: DiskSweep needs access only when you choose to analyze files in Documents.
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: DiskSweep needs access only when you choose to analyze files on the Desktop.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - DiskSweepTests
      gatherCoverageData: true

  DiskSweepTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DiskSweepTests
    dependencies:
      - target: DiskSweep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.disksweep.DiskSweepTests
        GENERATE_INFOPLIST_FILE: YES
        # The test bundle is signed the same way as the app (same team, or ad hoc without
        # Config/Local.xcconfig). An unsigned bundle can't load into the hardened-runtime
        # host app once the app is signed with a team.
        CODE_SIGN_STYLE: Automatic
